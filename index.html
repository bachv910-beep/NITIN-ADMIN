<script>

// ---------- brand: logo + app name set by admin (Settings > App logo & name) ----------
function applyBrand(c){c=c||{};const t=(c.title||'').trim(),l=c.logo||'';
 document.title=(t?t+' - ':'')+'Admin Panel';

 document.querySelectorAll('[data-bl]').forEach(b=>{b.innerHTML='';b.style.display='none';if(!l)return;const i=new Image();i.alt='';i.style.cssText='width:100%;height:100%;border-radius:50%;object-fit:cover';i.onload=()=>{b.appendChild(i);b.style.display='flex'};i.src=l})}

// ---------- form helpers ----------
const F=(f,v)=>{v=v==null?'':v;const[n,l,t,o]=f;let h=`<label class="text-xs text-gray-500">${l}</label>`;
 if(t==='img')h+=`<div class="imgf" data-max="${o||720}"><input type="hidden" data-f="${n}" value="${esc(v)}"><div class="imgp">${v?`<img src="${esc(v)}">${String(v).startsWith('data:')?`<span class="text-xs text-gray-400"> ${Math.round(String(v).length/1024)} KB</span>`:''}`:'<span class="text-xs text-gray-400">No image</span>'}</div><input type="file" accept="image/*" class="text-xs mb-1" data-img="1"><div class="text-xs text-gray-400 mb-1">Auto-resized in your browser and saved as Base64 text in the database</div><button type="button" class="btn sm red mb-3" data-imgclear="1">Remove image</button></div>`;
 else if(t==='select')h+=`<select class="inp" data-f="${n}">${o.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
 else if(t==='area')h+=`<textarea class="inp" rows="4" data-f="${n}">${esc(v)}</textarea>`;
 else h+=`<input class="inp" type="${t}" data-f="${n}" value="${esc(v)}">`;return h};
const read=(r,fs)=>{const o={};fs.forEach(f=>{const v=r.querySelector(`[data-f="${f[0]}"]`).value.trim();o[f[0]]=f[2]==='number'?Number(v)||0:v});return o};
// ---------- Base64 image upload: shrink in the browser, save as text straight into the database ----------
const IMG_CAP=450000; // max ~250 KB of text per image
function b64Image(f,max){return new Promise((res,rej)=>{
 if(!/^image\//.test(f.type))return rej(new Error('Please choose an image file'));
 const u=URL.createObjectURL(f),im=new Image();
 im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('This image cannot be read'))};
 im.onload=()=>{URL.revokeObjectURL(u);
  const W=im.naturalWidth||300,H=im.naturalHeight||300;let k=Math.min(1,max/Math.max(W,H)),out='';
  for(let t=0;t<6;t++){
   const w=Math.max(1,Math.round(W*k)),h=Math.max(1,Math.round(H*k)),c=document.createElement('canvas');c.width=w;c.height=h;
   const x=c.getContext('2d');x.drawImage(im,0,0,w,h);
   let d=c.toDataURL('image/webp',.8);
   if(!d.startsWith('data:image/webp')){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,w,h);d=c.toDataURL('image/jpeg',.8)}
   const m=d.slice(5,d.indexOf(';'));
   for(let q=.7;d.length>IMG_CAP&&q>.3;q-=.15)d=c.toDataURL(m,q);
   out=d;if(d.length<=IMG_CAP)break;k*=.75}
  out.length<=IMG_CAP?res(out):rej(new Error('Image is too detailed - choose a simpler or smaller image'))};
 im.src=u})}
function imgPrev(box,v){const p=box.querySelector('.imgp');p.innerHTML='';
 if(!v){p.innerHTML='<span class="text-xs text-gray-400">No image</span>';return}
 const i=new Image();i.src=v;p.appendChild(i);
 if(v.startsWith('data:')){const s=document.createElement('span');s.className='text-xs text-gray-400';s.textContent=' '+Math.round(v.length/1024)+' KB';p.appendChild(s)}}
document.addEventListener('change',async e=>{const i=e.target,f=i.files&&i.files[0];if(!i.dataset.img||!f)return;
 const box=i.closest('.imgf'),hid=box.querySelector('[data-f]');toast('Processing image...');i.disabled=true;
 try{hid.value=await b64Image(f,Number(box.dataset.max)||720);imgPrev(box,hid.value);toast('Image ready - now press Save / Add')}catch(x){toast('Image failed: '+x.message,1)}
 i.disabled=false;i.value=''});
document.addEventListener('click',e=>{const b=e.target.closest('[data-imgclear]');if(!b)return;const box=b.closest('.imgf');box.querySelector('[data-f]').value='';imgPrev(box,'')});

// ---------- auth ----------

$('aBtn').onclick=async()=>{const e=$('aE').value.trim(),p=$('aP').value;
 try{if(creating){if(p!==$('a2').value)return toast('Passwords do not match',1);busy=true;const c=await auth.createUserWithEmailAndPassword(e,p);
   await db.ref().update({['admins/'+c.user.uid]:true,'app_config/adminCreated':true});busy=false;enter(c.user)}
  else await auth.signInWithEmailAndPassword(e,p)}catch(x){busy=false;toast(x.message,1)}};
async function enter(u){const ok=await db.ref('admins/'+u.uid).once('value').then(s=>s.val()===true).catch(()=>false);

auth.onAuthStateChanged(async u=>{if(busy)return;if(!u){const s=await db.ref('app_config/adminCreated').once('value').catch(()=>null);return showAuth(!(s&&s.val()===true))}enter(u)});

const NAV=[['dash','fa-chart-simple','Dashboard'],['users','fa-users','Users'],['games','fa-gamepad','Games'],['matches','fa-trophy','Matches'],['sliders','fa-images','Sliders'],['notifs','fa-bell','Notifications'],['pay','fa-wallet','Deposits / Withdrawals'],['staff','fa-user-shield','Staff'],['activity','fa-clipboard-list','Staff Activity'],['settings','fa-gear','Settings']];
$('nav').innerHTML=NAV.map(n=>`<button data-a="go" data-v="${n[0]}" class="nv w-full text-left flex items-center gap-3 px-4 py-3 rounded-xl text-gray-300 hover:bg-white/10 hover:text-white"><i class="fa-solid ${n[1]}"></i><span>${n[2]}</span></button>`).join('');
function go(id){$('title').textContent=NAV.find(x=>x[0]===id)[2];document.querySelectorAll('.nv').forEach(b=>b.classList.toggle('active',b.dataset.v===id));

const V={dash:vDash,users:vUsers,matches:vMatches,settings:vSettings,pay:vPay,staff:vStaff,activity:vActivity,
 games:()=>vList('esports_games','Game',[['name','Game name','text'],['imgUrl','Game image','img',400]]),

// ---------- dashboard ----------
async function vDash(){
 const [u,gm,up,on,rs]=await Promise.all(['users','esports_games','tournaments/upcoming','tournaments/ongoing','tournaments/resulted'].map(p=>db.ref(p).once('value').then(s=>s.val()||{})));
 const n=o=>Object.keys(o).length,wal=Object.values(u).reduce((a,x)=>a+(x.walletBalance||0),0),joins=[up,on,rs].reduce((a,o)=>a+Object.values(o).reduce((b,m)=>b+(m.joined||0),0),0);
 const C=[['users','fa-users',n(u),'Total Users'],['users','fa-wallet','₹'+wal,'Total Wallet Balance'],['games','fa-gamepad',n(gm),'Games'],['matches','fa-clock',n(up),'Upcoming Matches'],['matches','fa-fire',n(on),'Ongoing Matches'],['matches','fa-circle-check',n(rs),'Resulted Matches'],['matches','fa-ticket',joins,'Total Joins']];

let U=[];
// total = walletBalance, win = winBalance (capped at total), deposit = total - win (same rule as the app)
const bal=u=>{const t=Number(u.walletBalance)||0,w=Math.min(Number(u.winBalance)||0,t);return{total:t,win:w,dep:t-w,rawWin:Number(u.winBalance)||0}};

 const draw=()=>{const q=$('q').value.toLowerCase();$('ul').innerHTML=U.filter(([k,u])=>[u.username,u.email,u.phone].join(' ').toLowerCase().includes(q)).map(([k,u])=>
  `<div class="flex flex-wrap items-center gap-2 border-b py-3"><div class="flex-1 min-w-[180px] text-sm"><b>${esc(u.username)}</b>${u.banned===true?' <span class="text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-700">Banned</span>':''}<div class="text-xs text-gray-400">${esc(u.email)} • ${esc(u.phone||'')}</div><div class="text-xs">Total ₹${bal(u).total} • <span class="text-blue-700">Deposit ₹${bal(u).dep}</span> • <span class="text-green-700">Win ₹${bal(u).win}</span></div><div class="text-xs text-gray-500">Earned ₹${u.totalEarnings||0} • Matches ${u.matchesPlayed||0}</div></div><button class="btn sm" data-a="bedit" data-k="${k}">Edit Balance</button><button class="btn sm grn" data-a="wallet" data-k="${k}">± Wallet</button><button class="btn sm" data-a="prize" data-k="${k}">+ Prize</button>${u.banned===true?`<button class="btn sm grn" data-a="unban" data-k="${k}">Unban</button>`:`<button class="btn sm red" data-a="ban" data-k="${k}">Ban</button>`}<button class="btn sm red" data-a="udel" data-k="${k}">Delete</button></div>`).join('')||'<p class="text-gray-400 text-sm">No players.</p>'};
 $('q').oninput=draw;draw()}

// ---------- generic list (games / sliders / notifications) ----------
let ctx={},EK=null;
async function vList(path,label,fields,pre){
 const rows=await snap(path);ctx={path,fields,pre,rows:Object.fromEntries(rows),re:()=>vList(path,label,fields,pre)};
 $('main').innerHTML=`<div class="grid lg:grid-cols-3 gap-4"><div class="card"><h3 class="font-bold mb-3">Add ${label}</h3><div id="f">${fields.map(f=>F(f)).join('')}</div><button class="btn w-full" data-a="add">Add</button></div>

// ---------- matches ----------
let MS='upcoming',MG='All',M={},GL=[];
const RF=[['roomId','Room ID','text'],['roomPass','Room password','text']];
const MF=()=>[['game','Game','select',GL],['title','Match title','text'],['time','Time (e.g. 07/10/2026 at 06:40 PM)','text'],['prizePool','Prize pool ₹','number'],['perKill','Per kill ₹','number'],['entryFee','Entry fee ₹','number'],['type','Type (BATTLE ROYAL etc.)','text'],['map','Map','text'],['totalSpots','Total spots','number'],['bannerUrl','Banner image','img',720],['prizeNote','Prize details (shown in Contest Details, e.g. BOOYAH 20 COINS)','area'],['resultNote','Result note (shown on Match Result page)','area'],['rules','Game rules (text, blank line = new rule card)','area'],['rulesImg','Game rules image (optional)','img',900],['maxJoinPerUser','Max joins per user (how many times one player can join)','number'],['status','Status','select',['upcoming','ongoing','resulted']]];

 GL=(await snap('esports_games')).map(g=>g[1].name);
 if(!GL.length){$('main').innerHTML='<div class="card">Add at least one Game first (Games tab).</div>';return}
 const rows=await snap('tournaments/'+MS);M=Object.fromEntries(rows);
 const list=rows.filter(([k,v])=>MG==='All'||v.game===MG);
 $('main').innerHTML=`<div class="flex flex-wrap gap-2 mb-4 items-center">${['upcoming','ongoing','resulted'].map(x=>`<button data-a="mst" data-v="${x}" class="px-4 py-2 rounded-lg text-sm font-semibold capitalize ${x===MS?'bg-[#6300ea] text-white':'bg-white/10 border border-white/15 text-gray-300'}">${x}</button>`).join('')}
 <select id="mg" class="inp !w-auto !mb-0 ml-auto">${['All',...GL].map(x=>`<option ${x===MG?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="btn grn" data-a="madd">+ Add Match</button></div>
 <div class="grid md:grid-cols-2 gap-4">${list.map(([k,v])=>`<div class="card">${v.bannerUrl?`<img src="${esc(v.bannerUrl)}" class="w-full h-28 object-cover rounded-lg mb-2">`:''}

// ---------- copy match: many copies, same details, time gap ----------
let MCK=null,MCB=false;
const MCO=t=>{const x=String(t||'').match(/(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*\d{4}/);return x&&+x[2]>12&&+x[1]<=12?'mdy':'dmy'};
const MCP=(t,o)=>{const x=String(t||'').match(/(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{4})\D+?(\d{1,2})\s*:\s*(\d{2})\s*(?:([AaPp])\.?[Mm])?/);if(!x)return null;
 const a=+x[1],b=+x[2],y=+x[3],mi=+x[5];let h=+x[4],ap=x[6];const dd=o==='mdy'?b:a,mo=o==='mdy'?a:b;
 if(mo<1||mo>12||dd<1||dd>31||mi>59||h>23)return null;
 if(ap){ap=ap.toUpperCase();if(h<1||h>12)return null;if(ap==='P'&&h<12)h+=12;if(ap==='A'&&h===12)h=0}
 return Date.UTC(y,mo-1,dd,h,mi)};
const MCF=(ms,o)=>{const d=new Date(ms),p=n=>String(n).padStart(2,'0'),h=d.getUTCHours(),dd=p(d.getUTCDate()),mo=p(d.getUTCMonth()+1);
 return (o==='mdy'?mo+'/'+dd:dd+'/'+mo)+'/'+d.getUTCFullYear()+' at '+p(h%12||12)+':'+p(d.getUTCMinutes())+' '+(h<12?'AM':'PM')};
function mcprev(){const m=M[MCK],v=$('cpv');if(!m||!v)return;const n=Math.floor(+$('cpn').value)||0,g=Math.floor(+$('cpg').value)||0,o=$('cpo').value,b=MCP(m.time,o);
 if(b==null){v.textContent='Original match time not understood. Edit the match time like 07/10/2026 at 06:40 PM and try again.';return}
 if(n<1||g<1){v.textContent='Enter copies and gap (minutes)';return}
 const L=i=>MCF(b+i*g*6e4,o),s=[1,2,3].filter(i=>i<=n).map(i=>i+'. '+L(i));if(n>4)s.push('...');if(n>3)s.push(n+'. '+L(n));v.innerHTML=s.map(esc).join('<br>')}

 staffadd:()=>modal(`<h3 class="font-bold mb-3">Add Staff</h3><label class="text-xs text-gray-500">Name</label><input id="sN" class="inp"><label class="text-xs text-gray-500">Email (login)</label><input id="sE" type="email" class="inp"><label class="text-xs text-gray-500">Password (min 6 chars) - share it with the staff member</label><input id="sP" type="text" class="inp"><div class="text-xs text-gray-500 mb-1 mt-2">Permissions</div><div id="sPm" class="mb-3">${permBoxes()}</div><div class="flex gap-2"><button class="btn grn flex-1" data-a="staffcreate">Create</button><button class="btn red flex-1" data-a="close">Cancel</button></div>`),
 staffcreate:async()=>{const name=$('sN').value.trim(),email=$('sE').value.trim(),pass=$('sP').value;
  if(!name||!email)return toast('Name and email are required',1);if(pass.length<6)return toast('Password must be at least 6 characters',1);
  const perms=readPerms($('sPm')),sec=firebase.apps.find(x=>x.name==='staffsetup')||firebase.initializeApp(FBCFG,'staffsetup');
  let uid;try{uid=(await sec.auth().createUserWithEmailAndPassword(email,pass)).user.uid}finally{await sec.auth().signOut().catch(()=>{})} // separate app instance: the admin stays logged in
  await db.ref('staff/'+uid).set({name,email,active:true,permissions:perms,createdAt:Date.now()});
  closeM();toast('Staff account created');vStaff()},
 staffedit:d=>{const s=Object.fromEntries(ST)[d.k];if(!s)return;
  modal(`<h3 class="font-bold mb-1">Edit Staff</h3><div class="text-xs text-gray-500 mb-3">${esc(s.email)}</div><label class="text-xs text-gray-500">Name</label><input id="sN" class="inp" value="${esc(s.name)}"><label class="flex items-center gap-2 text-sm mb-3"><input type="checkbox" id="sA" ${s.active===false?'':'checked'}> Account active (can log in)</label><div class="text-xs text-gray-500 mb-1">Permissions</div><div id="sPm" class="mb-3">${permBoxes(s.permissions)}</div><div class="flex gap-2"><button class="btn grn flex-1" data-a="staffsave" data-k="${esc(d.k)}">Save</button><button class="btn red flex-1" data-a="close">Cancel</button></div>`)},
 staffsave:async d=>{const name=$('sN').value.trim();if(!name)return toast('Name is required',1);
  await db.ref('staff/'+d.k).update({name,active:$('sA').checked,permissions:readPerms($('sPm'))});closeM();toast('Staff updated');vStaff()},
 staffdel:async d=>{const s=Object.fromEntries(ST)[d.k];if(!s||!confirm('Remove '+s.name+'? They will no longer be able to use the staff panel.'))return;
  await db.ref('staff/'+d.k).remove();toast('Staff removed');vStaff()},
 staffreset:async d=>{const s=Object.fromEntries(ST)[d.k];if(!s)return;await auth.sendPasswordResetEmail(s.email);toast('Password reset email sent to '+s.email)},
 wallet:async d=>{const n=Number(prompt('Amount to add to wallet (negative to deduct):'));if(!n)return;await db.ref('users/'+d.k+'/walletBalance').set(inc(n));toast('Wallet updated');vUsers()},
 prize:async d=>{const n=Number(prompt('Prize won ₹ (adds to wallet, earnings & leaderboard):'));if(!(n>0))return;const name=U.find(x=>x[0]===d.k)[1].username||'',up={};
  up[`users/${d.k}/walletBalance`]=inc(n);up[`users/${d.k}/totalEarnings`]=inc(n);up[`users/${d.k}/winBalance`]=inc(n);hist(up,d.k,'win',n,'Prize from admin');
  ['weekly','monthly','fulltime'].forEach(t=>{up[`leaderboard/${t}/${d.k}/prize`]=inc(n);up[`leaderboard/${t}/${d.k}/name`]=name});
  await db.ref().update(up);toast('Prize added');vUsers()},
 ban:async d=>{const u=U.find(x=>x[0]===d.k);if(!u||!confirm('Ban '+(u[1].username||'this player')+'? They will be logged out and cannot join matches, recharge or withdraw.'))return;
  await db.ref().update({['users/'+d.k+'/banned']:true,['users/'+d.k+'/bannedAt']:Date.now()});toast('Player banned');vUsers()},
 unban:async d=>{await db.ref().update({['users/'+d.k+'/banned']:null,['users/'+d.k+'/bannedAt']:null});toast('Player unbanned');vUsers()},
 udel:async d=>{const u=U.find(x=>x[0]===d.k);if(!u)return;const v=u[1];
  if(!confirm('DELETE '+(v.username||'this player')+' ('+(v.email||'')+')?\nTheir profile, wallet balance and stats will be removed. This cannot be undone.'))return;
  const up={['users/'+d.k]:null};if(v.referralCode)up['referralCodes/'+v.referralCode]=null;
  await db.ref().update(up);toast('Player deleted');vUsers()},
 reset:async d=>{if(confirm('Reset '+d.t+' leaderboard?')){await db.ref('leaderboard/'+d.t).remove();toast('Reset done')}},
 madd:()=>{EK=null;mform('Add Match',{status:MS,maxJoinPerUser:1})},
 medit:d=>{EK=d.k;mform('Edit Match',M[d.k])},
 mcopy:d=>{const m=M[d.k];if(!m)return;MCK=d.k;
  modal(`<h3 class="font-bold mb-1">Copy match</h3><div class="text-xs text-gray-400" style="margin-bottom:12px">#${esc(m.id)} • ${esc(m.title)} • ${esc(m.time)}</div><div id="mcf">
  <label class="text-xs text-gray-500">How many copies (1 to 50)</label><input id="cpn" class="inp" type="number" min="1" max="50" value="5">
  <label class="text-xs text-gray-500">Time gap between matches (minutes)</label><input id="cpg" class="inp" type="number" min="1" value="30" style="margin-bottom:6px">
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${[[15,'15 min'],[30,'30 min'],[45,'45 min'],[60,'1 hour'],[90,'1.5 hour'],[120,'2 hour'],[180,'3 hour']].map(([v,l])=>`<button type="button" class="btn sm" style="background:rgba(255,255,255,.12)" data-a="mcgap" data-v="${v}">${l}</button>`).join('')}</div>
  <label class="text-xs text-gray-500">Date format in match time</label><select id="cpo" class="inp"><option value="dmy" ${MCO(m.time)==='dmy'?'selected':''}>DD/MM/YYYY</option><option value="mdy" ${MCO(m.time)==='mdy'?'selected':''}>MM/DD/YYYY</option></select>
  <div class="text-xs text-gray-400" style="margin-bottom:4px">Copy times (first copy = this match time + gap):</div><div id="cpv" class="text-xs text-gray-400" style="margin-bottom:12px;color:#fff"></div></div>
  <div class="text-xs text-gray-400" style="margin-bottom:10px">Every copy is a separate new match (own ID, own room ID / password, 0 players) with the same name and details. It goes to Upcoming.</div>
  <div style="display:flex;gap:8px"><button class="btn grn" style="flex:1" data-a="mcgo">Create copies</button><button class="btn red" style="flex:1" data-a="close">Cancel</button></div>`);mcprev()},
 mcgap:d=>{$('cpg').value=d.v;mcprev()},
 mcgo:async d=>{const m=M[MCK];if(!m||MCB)return;const n=Math.floor(+$('cpn').value)||0,g=Math.floor(+$('cpg').value)||0,o=$('cpo').value,b=MCP(m.time,o);
  if(n<1||n>50)return toast('Copies must be between 1 and 50',1);if(g<1)return toast('Gap must be at least 1 minute',1);if(b==null)return toast('Original match time not understood. Edit it like 07/10/2026 at 06:40 PM',1);
  MCB=true;try{const ids=new Set((await Promise.all(['upcoming','ongoing','resulted'].map(s=>snap('tournaments/'+s)))).flat().map(([k,v])=>String(v&&v.id)));const made=[];
   for(let i=1;i<=n;i++){let id;do{id=String(Math.floor(1e5+Math.random()*9e5))}while(ids.has(id));ids.add(id);
    made.push({key:db.ref('tournaments/upcoming').push().key,m:{...m,id,joined:0,status:'upcoming',time:MCF(b+i*g*6e4,o),entryPerPlayer:String(m.entryFee),resultNote:''}})}
   for(let i=0;i<made.length;i+=5){const up={};made.slice(i,i+5).forEach(x=>{up['tournaments/upcoming/'+x.key]=x.m;up['match_rooms/'+x.m.id]={roomId:'',roomPass:''}});await db.ref().update(up)}
   
   MS='upcoming';closeM();toast(n+' copies created');vMatches()}finally{MCB=false}},

 msave:async()=>{const d=read($('mf'),MF());if(!d.title)return toast('Match title required',1);
  const old=EK?M[EK]:null,key=EK||db.ref('tournaments/'+d.status).push().key,up={};
  const m={joined:0,...old,...d,id:old?old.id:String(Math.floor(1e5+Math.random()*9e5)),entryPerPlayer:String(d.entryFee)};
  if(EK&&MS!==d.status)up['tournaments/'+MS+'/'+key]=null;up['tournaments/'+d.status+'/'+key]=m;if(!old)up['match_rooms/'+m.id]={roomId:'',roomPass:''};
  await db.ref().update(up);closeM();toast('Saved');vMatches()},
 mv:async d=>{await db.ref().update({['tournaments/'+MS+'/'+d.k]:null,['tournaments/'+d.v+'/'+d.k]:{...M[d.k],status:d.v}});toast('Moved to '+d.v);vMatches()},
 mdel:async d=>{if(!confirm('Delete this match?'))return;await db.ref().update({['tournaments/'+MS+'/'+d.k]:null,['match_participants/'+M[d.k].id]:null,['match_results/'+M[d.k].id]:null,['match_rooms/'+M[d.k].id]:null});vMatches()},
 mplay:async d=>{const m=M[d.k],rows=await snap('match_participants/'+m.id);
  modal(`<h3 class="font-bold mb-2">Players in #${esc(m.id)} (${rows.length})</h3>${rows.map(([k,p])=>`<div class="border-b py-2 text-sm"><b>${esc(p.ign)}</b> • UID ${esc(p.gameUid)}${p.count>1?` <span class="text-xs text-purple-600">×${p.count} joins</span>`:''}<div class="text-xs text-gray-400">${esc(p.name)}${p.slots&&p.count>1?' • '+Object.values(p.slots).map(s=>esc(s.ign)+' ('+esc(s.gameUid)+')').join(', '):''}</div></div>`).join('')||'<p class="text-sm text-gray-400">No players joined yet.</p>'}<button class="btn w-full mt-3" style="background:#0ea5e9" data-a="msend" data-k="${d.k}"><i class="fa-solid fa-paper-plane mr-1"></i>Send ID Pass</button><button class="btn w-full mt-2" data-a="close">Close</button>`)},
 msend:async d=>{const m=M[d.k];if(!m)return;
  const rm=(await db.ref('match_rooms/'+m.id).once('value').then(x=>x.val(),()=>null))||{};
  modal(`<h3 class="font-bold mb-3">Send ID Pass - #${m.id}</h3><div id="rf">${RF.map(f=>F(f,rm[f[0]])).join('')}</div><div class="flex gap-2"><button class="btn grn flex-1" data-a="msendgo" data-k="${d.k}">Send</button><button class="btn red flex-1" data-a="close">Cancel</button></div>`)},
 msendgo:async d=>{const m=M[d.k];if(!m)return;
  const r=read($('rf'),RF);
  if(!r.roomId&&!r.roomPass)return toast('Enter Room ID / Password',1);
  const now=Date.now();
  await db.ref('match_rooms/'+m.id).set({roomId:r.roomId,roomPass:r.roomPass,sentAt:now});
  const rows=await snap('match_participants/'+m.id);
  const title='Room ID & Password - #'+m.id,message=(m.title?m.title+'\n':'')+'Room ID: '+(r.roomId||'-')+'\nPassword: '+(r.roomPass||'-')+'\nOpen the game and join the room now!';
  let ok=0;
  for(const [uid] of rows){try{await db.ref('user_notifications/'+uid).push({title,message,time:now,matchId:m.id});ok++}catch(e){}}
  closeM();
  if(!rows.length)toast('Saved. No players have joined yet');
  else if(ok===rows.length)toast('Room ID & Password sent to '+ok+' player(s)');
  else toast('Saved - players see it in match view. Notification blocked: add Firebase rule for user_notifications',1)},
 mres:async d=>{const m=M[d.k];if(!m)return;
  const [rows,saved]=await Promise.all([snap('match_participants/'+m.id),db.ref('match_results/'+m.id).once('value').then(x=>x.val()||{})]);
  RES={k:d.k,m,perKill:Number(m.perKill)||0,players:rows.map(([uid,p])=>{const r=saved[uid]||{};return{uid,ign:p.ign||'',gameUid:p.gameUid||'',name:p.name||'',paid:!!r.paid,kills:r.kills||0,extra:r.extra||0}})};
  const ps=RES.players;
  modal(`<h3 class="font-bold mb-1">Kills &amp; Rewards • #${esc(m.id)}</h3><p class="text-xs text-gray-500 mb-3">Reward = kills × ₹${RES.perKill} per kill + extra reward. <b>Save</b> keeps the result visible to players. <b>Save &amp; Pay</b> also credits wallet, earnings, kills and leaderboard (only once per player).</p>
  ${ps.map(p=>`<div class="border-b py-2 text-sm"><div><b>${esc(p.ign)}</b> • UID ${esc(p.gameUid)} <span class="text-xs text-gray-400">${esc(p.name)}</span> ${p.paid?'<span class="text-xs text-green-600 font-semibold">Paid <i class="fa-solid fa-check"></i></span>':''}</div>
   <div class="flex flex-wrap items-center gap-2 mt-1"><label class="text-xs text-gray-500">Kills <input type="number" min="0" class="inp !mb-0 !w-20" data-rk="${esc(p.uid)}" value="${p.kills}" ${p.paid?'disabled':''}></label>
   <label class="text-xs text-gray-500">Extra ₹ <input type="number" min="0" class="inp !mb-0 !w-24" data-re="${esc(p.uid)}" value="${p.extra}" ${p.paid?'disabled':''}></label>
   <div class="text-xs ml-auto">Reward: <b data-rt="${esc(p.uid)}">₹0</b></div></div></div>`).join('')||'<p class="text-sm text-gray-400">No players joined this match.</p>'}
  <div class="flex gap-2 mt-3">${ps.length?'<button class="btn flex-1" data-a="rsave">Save</button><button class="btn grn flex-1" data-a="rpay">Save &amp; Pay</button>':''}<button class="btn red flex-1" data-a="close">Close</button></div>`);
  ps.forEach(p=>rcalc(p.uid))},
 rsave:async d=>{if(!RES)return;const quiet=d&&d.quiet,id=RES.m.id;
  const fresh=(await db.ref('match_results/'+id).once('value')).val()||{},up={};
  RES.players.forEach(p=>{if(fresh[p.uid]&&fresh[p.uid].paid)return;const r=rvals(p.uid);
   up[`match_results/${id}/${p.uid}`]={ign:p.ign,gameUid:p.gameUid,name:p.name,kills:r.kills,extra:r.extra,reward:r.reward,paid:false}});
  if(!Object.keys(up).length){if(!quiet)toast('All players already paid',1);return}
  await db.ref().update(up);if(!quiet)toast('Results saved')},
 rpay:async()=>{if(!RES||paying)return;paying=true;
  try{await ACT.rsave({quiet:1});const id=RES.m.id,fresh=(await db.ref('match_results/'+id).once('value')).val()||{};
   const todo=RES.players.filter(p=>fresh[p.uid]&&!fresh[p.uid].paid);
   if(!todo.length)return toast('Nothing left to pay',1);
   const tot=todo.reduce((a,p)=>a+(fresh[p.uid].reward||0),0);
   if(!confirm(`Pay ₹${tot} to ${todo.length} player(s)?\nWallets, earnings and leaderboard will be updated. This cannot be undone.`))return;
   const up={};
   todo.forEach(p=>{const r=fresh[p.uid],b=`match_results/${id}/${p.uid}`;up[b+'/paid']=true;up[b+'/paidAt']=Date.now();
    if(r.kills>0)up[`users/${p.uid}/totalKills`]=inc(r.kills);
    if(r.reward>0){up[`users/${p.uid}/walletBalance`]=inc(r.reward);up[`users/${p.uid}/totalEarnings`]=inc(r.reward);up[`users/${p.uid}/winBalance`]=inc(r.reward);hist(up,p.uid,'win',r.reward,'Match #'+id+' reward');
     ['weekly','monthly','fulltime'].forEach(t=>{up[`leaderboard/${t}/${p.uid}/prize`]=inc(r.reward);up[`leaderboard/${t}/${p.uid}/name`]=p.name||p.ign})}});
   await db.ref().update(up);toast('Rewards paid');await ACT.mres({k:RES.k})}
  finally{paying=false}},
 dok:async d=>{const b=`deposits/${d.u}/${d.k}`,x=await pend(b);if(!x)return toast('Already processed',1);
  const up={};up[b+'/status']='approved';up[b+'/doneAt']=Date.now();up[`users/${d.u}/walletBalance`]=inc(x.amount);hist(up,d.u,'deposit',x.amount,'Recharge approved');
  await db.ref().update(up);toast('Deposit approved');vPay()},
 dno:async d=>{const b=`deposits/${d.u}/${d.k}`,x=await pend(b);if(!x)return toast('Already processed',1);
  const up={};up[b+'/status']='rejected';up[b+'/doneAt']=Date.now();hist(up,d.u,'deposit',0,'Recharge rejected (₹'+x.amount+')');
  await db.ref().update(up);toast('Rejected');vPay()},
 wok:async d=>{const b=`withdrawals/${d.u}/${d.k}`,x=await pend(b);if(!x)return toast('Already processed',1);
  const up={};up[b+'/status']='paid';up[b+'/doneAt']=Date.now();hist(up,d.u,'withdraw',0,'Withdrawal of ₹'+x.amount+' paid');
  await db.ref().update(up);toast('Marked as paid');vPay()},
 cp:async d=>{try{await navigator.clipboard.writeText(d.v);toast('Copied')}catch(e){prompt('Copy:',d.v)}},
 pdel:async d=>{const p=(d.t==='d'?'deposits/':'withdrawals/')+d.u+'/'+d.k,x=(await db.ref(p).once('value')).val();if(!x)return vPay();
  if(d.t==='w'&&x.status==='pending')return toast('Pending withdrawal: first Mark Paid or Reject',1);
  if(!confirm('Delete this entry? This cannot be undone.'))return;await db.ref(p).remove();toast('Deleted');vPay()},
 pclear:async d=>{const root=d.t==='d'?'deposits':'withdrawals',all=(await db.ref(root).once('value')).val()||{},up={};let c=0;
  Object.entries(all).forEach(([u,r])=>Object.entries(r||{}).forEach(([k,v])=>{if(v&&v.status!=='pending'){up[`${root}/${u}/${k}`]=null;c++}}));
  if(!c)return toast('Nothing to delete',1);if(!confirm('Delete '+c+' done (non-pending) entries? This cannot be undone.'))return;
  await db.ref().update(up);toast(c+' deleted');vPay()},
 wno:async d=>{const b=`withdrawals/${d.u}/${d.k}`,x=await pend(b);if(!x)return toast('Already processed',1);
  const up={};up[b+'/status']='rejected';up[b+'/doneAt']=Date.now();up[`users/${d.u}/walletBalance`]=inc(x.amount);up[`users/${d.u}/winBalance`]=inc(x.amount);hist(up,d.u,'refund',x.amount,'Withdrawal rejected, refunded');
  await db.ref().update(up);toast('Rejected & refunded');vPay()}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&ACT[a.dataset.a])Promise.resolve(ACT[a.dataset.a](a.dataset)).catch(x=>toast(x.message,1))});
</script></body></html>
